[project]
name = "reconai-backend"
version = "0.1.0"
description = "FastAPI backend foundation for ReconAI."
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.17",
  "fastapi[standard]>=0.115.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app"]
